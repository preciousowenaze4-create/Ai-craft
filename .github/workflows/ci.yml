name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gate as local `npm test`: tsc type-check → vite build →
      # mesh failover tests → SSE e2e (chat + build turns) → friendly-error.
      # The suites scrub ambient provider keys and only talk to local mock
      # lanes, so no secrets are required.
      - name: Run checks and tests
        run: npm test
